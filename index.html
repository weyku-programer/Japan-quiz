
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Quiz | Weyku</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #ecfdf5;
      background: #07110d;
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: 30px;
      border: 1px solid #24513d;
      border-radius: 20px;
      background: #101c16;
      box-shadow: 0 20px 60px #0008;
    }

    .brand {
      color: #34d399;
      font-weight: bold;
      letter-spacing: 3px;
    }

    h1 { margin-bottom: 8px; }
    .muted { color: #a7b8ae; }
    #progress { margin: 24px 0 10px; font-size: 14px; }

    #answers {
      display: grid;
      gap: 10px;
      margin: 22px 0;
    }

    button {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #315340;
      border-radius: 10px;
      color: #ecfdf5;
      background: #17271e;
      cursor: pointer;
      font-size: 16px;
      text-align: left;
    }

    button:hover:not(:disabled) {
      border-color: #34d399;
      background: #203a2b;
    }

    button:focus-visible {
      outline: 2px solid #34d399;
      outline-offset: 3px;
    }

    button:disabled { cursor: default; opacity: 0.85; }

    #next, #restart {
      margin-top: 12px;
      color: #052e1c;
      background: #34d399;
      border: none;
      font-weight: bold;
      text-align: center;
    }

    .correct { border-color: #34d399; }
    .wrong { border-color: #fb7185; }
    #feedback { min-height: 24px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">WEYKU</div>
    <h1>Japan Quiz 🇯🇵</h1>
    <p class="muted">Test your knowledge of Japan.</p>

    <section id="quiz">
      <div id="progress"></div>
      <h2 id="question"></h2>
      <div id="answers"></div>
      <p id="feedback" aria-live="polite"></p>
      <button id="next" hidden>Next question →</button>
    </section>

    <section id="result" hidden>
      <h2>Quiz completed!</h2>
      <p id="score"></p>
      <button id="restart">Try again</button>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "What is the capital of Japan?",
        answers: ["Kyoto", "Tokyo", "Osaka", "Hiroshima"],
        correct: 1
      },
      {
        question: "What is Japan's currency?",
        answers: ["Won", "Dollar", "Yen", "Euro"],
        correct: 2
      },
      {
        question: "What is Japan's highest mountain?",
        answers: ["Mount Fuji", "Mount Aso", "Mount Kita", "Mount Haku"],
        correct: 0
      },
      {
        question: "Which is a traditional Japanese garment?",
        answers: ["Hanbok", "Kimono", "Sari", "Kilt"],
        correct: 1
      },
      {
        question: "Which city was formerly known as Edo?",
        answers: ["Nara", "Kobe", "Tokyo", "Sapporo"],
        correct: 2
      }
    ];

    let current = 0;
    let points = 0;
    let answered = false;

    const progress = document.querySelector("#progress");
    const question = document.querySelector("#question");
    const answers = document.querySelector("#answers");
    const feedback = document.querySelector("#feedback");
    const next = document.querySelector("#next");
    const quiz = document.querySelector("#quiz");
    const result = document.querySelector("#result");
    const score = document.querySelector("#score");

    function showQuestion() {
      answered = false;
      const item = questions[current];

      progress.textContent =
        `Question ${current + 1} of ${questions.length}`;
      question.textContent = item.question;
      answers.replaceChildren();
      feedback.textContent = "";
      next.hidden = true;

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.textContent = answer;
        button.addEventListener("click", () => chooseAnswer(index));
        answers.appendChild(button);
      });
    }

    function chooseAnswer(index) {
      if (answered) return;
      answered = true;

      const item = questions[current];
      const buttons = answers.querySelectorAll("button");

      buttons.forEach((button, i) => {
        button.disabled = true;
        if (i === item.correct) button.classList.add("correct");
      });

      if (index === item.correct) {
        points++;
        feedback.textContent = "Correct! Well done.";
      } else {
        buttons[index].classList.add("wrong");
        feedback.textContent =
          `Not quite! The answer is ${item.answers[item.correct]}.`;
      }

      next.textContent =
        current === questions.length - 1 ? "See my score →" : "Next question →";
      next.hidden = false;
    }

    next.addEventListener("click", () => {
      current++;

      if (current < questions.length) {
        showQuestion();
      } else {
        quiz.hidden = true;
        result.hidden = false;
        score.textContent =
          `You scored ${points} out of ${questions.length}!`;
      }
    });

    document.querySelector("#restart").addEventListener("click", () => {
      current = 0;
      points = 0;
      result.hidden = true;
      quiz.hidden = false;
      showQuestion();
    });

    showQuestion();
  </script>
</body>
</html>
